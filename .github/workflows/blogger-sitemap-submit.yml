name: New Blog Portfolio SEO Audit

on:
  schedule:
    # Check the production portfolio regularly for newly published blog URLs.
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      site_url:
        description: Production portfolio URL to audit (optional)
        required: false
        type: string

concurrency:
  group: new-blog-portfolio-seo-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-new-posts:
    name: Audit newly discovered portfolio blog posts
    runs-on: ubuntu-latest

    env:
      AUDIT_URL: ${{ inputs.site_url || vars.PRODUCTION_URL || 'https://zubair-hussain-portfolio.detroonshah.workers.dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Restore the previous sitemap state so existing URLs
      # are not repeatedly treated as newly published posts.
      - name: Restore blog URL baseline
        uses: actions/cache/restore@v4
        with:
          path: .sitemap-monitor-cache
          key: new-blog-seo-baseline-current
          restore-keys: |
            new-blog-seo-baseline-

      # This script only reads the portfolio sitemap.
      - name: Detect newly published portfolio blog posts
        id: sitemap
        run: |
          node .github/scripts/detect-sitemap-change.mjs "$AUDIT_URL"

      # Audit only URLs newly discovered in the portfolio sitemap.
      - name: Audit SEO readiness of new posts
        id: seo-audit
        if: steps.sitemap.outputs.new_count != '0'
        run: |
          node .github/scripts/audit-new-blog-posts.mjs \
            .sitemap-monitor-cache/new-urls.txt \
            artifacts/new-blog-seo-report.md

      - name: Create premium email and PDF report
        id: branded-report
        if: steps.seo-audit.outcome == 'success'
        continue-on-error: true
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/generate-branded-audit-report.mjs \
            blog \
            artifacts/new-blog-seo-report.md \
            artifacts/branded-blog-audit
          bash .github/scripts/render-audit-pdf.sh \
            artifacts/branded-blog-audit/portfolio-audit-report.html \
            artifacts/branded-blog-audit/Zubair-Hussain-New-Blog-SEO-Audit.pdf

      - name: Upload SEO audit report
        if: always() && steps.sitemap.outputs.new_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: new-blog-seo-audit-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30

      # Email is only a notification containing the audit result.
      # It does not submit URLs or sitemaps to Google.
      - name: Email portfolio SEO audit result
        id: readiness-email
        # Email is an optional notification. A missing/expired SMTP credential
        # must not turn a successful SEO audit into a failed workflow run.
        continue-on-error: true
        if: >-
          steps.sitemap.outputs.new_count != '0' &&
          steps.seo-audit.outcome == 'success'
        shell: bash

        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEW_URLS_FILE: .sitemap-monitor-cache/new-urls.txt
          REPORT_PATH: artifacts/new-blog-seo-report.md
          EMAIL_HTML_PATH: artifacts/branded-blog-audit/portfolio-audit-email.html
          EMAIL_TEXT_PATH: artifacts/branded-blog-audit/portfolio-audit-email.txt
          PDF_PATH: artifacts/branded-blog-audit/Zubair-Hussain-New-Blog-SEO-Audit.pdf

          SMTP_SERVER: ${{ secrets.AUDIT_SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.AUDIT_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.AUDIT_EMAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.AUDIT_EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.AUDIT_EMAIL_TO }}

        run: |
          bash .github/scripts/email-blog-readiness.sh

      # Save the new sitemap state only after the audit has completed.
      # Do not make baseline persistence depend on optional email delivery;
      # otherwise the same posts are rediscovered and emailed every hour.
      - name: Save updated blog URL baseline
        if: >-
          always() &&
          steps.sitemap.outcome == 'success' &&
          steps.sitemap.outputs.changed == 'true' &&
          (
            steps.sitemap.outputs.new_count == '0' ||
            steps.seo-audit.outcome == 'success'
          )
        uses: actions/cache/save@v4
        with:
          path: .sitemap-monitor-cache
          key: new-blog-seo-baseline-${{ steps.sitemap.outputs.digest }}
