name: New Blog SEO Readiness Audit

on:
  schedule:
    # Blogger content is external to GitHub, so check after its refresh window.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      site_url:
        description: Production URL to check (optional)
        required: false
        type: string

concurrency:
  group: new-blog-seo-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit-new-posts:
    name: Audit newly discovered blog posts
    runs-on: ubuntu-latest
    env:
      AUDIT_URL: ${{ inputs.site_url || vars.PRODUCTION_URL || 'https://zubair-hussain-portfolio.detroonshah.workers.dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore the most recent blog URL baseline
        uses: actions/cache/restore@v4
        with:
          path: .sitemap-monitor-cache
          key: new-blog-seo-baseline-current
          restore-keys: new-blog-seo-baseline-

      - name: Find newly published blog posts
        id: sitemap
        run: node .github/scripts/detect-sitemap-change.mjs "$AUDIT_URL"

      - name: Audit SEO readiness of new posts
        id: seo-audit
        if: steps.sitemap.outputs.new_count != '0'
        run: node .github/scripts/audit-new-blog-posts.mjs .sitemap-monitor-cache/new-urls.txt artifacts/new-blog-seo-report.md

      - name: Upload SEO audit report
        if: always() && steps.sitemap.outputs.new_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: new-blog-seo-audit-${{ github.run_id }}
          path: artifacts/new-blog-seo-report.md
          if-no-files-found: warn
          retention-days: 30

      - name: Email posts ready for manual Search Console submission
        id: readiness-email
        if: steps.sitemap.outputs.new_count != '0' && steps.seo-audit.outcome == 'success'
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NEW_URLS_FILE: .sitemap-monitor-cache/new-urls.txt
          REPORT_PATH: artifacts/new-blog-seo-report.md
          SMTP_SERVER: ${{ secrets.AUDIT_SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.AUDIT_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.AUDIT_EMAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.AUDIT_EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.AUDIT_EMAIL_TO }}
        run: bash .github/scripts/email-blog-readiness.sh

      - name: Save the updated blog URL baseline
        if: >-
          always() &&
          steps.sitemap.outcome == 'success' &&
          steps.sitemap.outputs.changed == 'true' &&
          (steps.sitemap.outputs.new_count == '0' ||
          (steps.seo-audit.outcome == 'success' && steps.readiness-email.outcome == 'success'))
        uses: actions/cache/save@v4
        with:
          path: .sitemap-monitor-cache
          key: new-blog-seo-baseline-${{ steps.sitemap.outputs.digest }}
