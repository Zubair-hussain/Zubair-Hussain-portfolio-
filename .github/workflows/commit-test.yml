name: Commit Test

# Validates that every commit message in a PR follows a conventional format,
# e.g. "feat: add contact form", "fix(chat): handle empty message".
# Keeps history clean and readable (and pairs well with auto-tagging).

on:
  pull_request:
    branches: [main]

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: |
          set -e
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: .{1,}'
          FAILED=0

          # Read subject lines of each commit in the PR range.
          while IFS= read -r subject; do
            [ -z "$subject" ] && continue
            # Allow merge commits.
            case "$subject" in
              Merge\ *) continue ;;
            esac
            if echo "$subject" | grep -Eq "$PATTERN"; then
              echo "✓ $subject"
            else
              echo "✗ $subject"
              FAILED=1
            fi
          done < <(git log --format=%s "$BASE".."$HEAD")

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "::error::One or more commit messages don't follow the conventional format."
            echo "Use: <type>(optional-scope): <description>"
            echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
