name: Docker Image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - 'src/**'
      - 'public/**'
      - next.config.mjs
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: portfolio:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
